name = "geowrisx-ad-v2"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# All secrets and per-environment values live in the Cloudflare Pages dashboard
# (Settings -> Variables and Secrets) or in .dev.vars for local development.
# Do not add a [vars] block here: dashboard values should stay authoritative.

# Patient attachments are stored in Cloudflare Workers KV (free plan, no card).
# Created once with: npx wrangler kv namespace create FILES
# Free limits: 1 GB total, single value up to 25 MB (matches MAX_UPLOAD_BYTES).
[[kv_namespaces]]
binding = "FILES"
id = "04cb4173d3f44a5a87137d052e10cfb4"
