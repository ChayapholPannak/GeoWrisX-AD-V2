<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7f6" />
    <meta
      name="description"
      content="GeoWrisX AD — แดชบอร์ดผู้ดูแลสำหรับติดตามเหตุการณ์จากสายรัดข้อมือและคำขอเปิดกล่องยาที่ผ่านการยืนยัน BLE"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232e7d6b'/%3E%3Cpath d='M32 50c-1-8-14-14-14-26 0-7 5.5-12 11-12 4.8 0 7.4 2.6 9 5.4 1.6-2.8 4.2-5.4 9-5.4 5.5 0 11 5 11 12 0 12-13 18-14 26z' fill='%23eef4f4' transform='translate(6 -2) scale(0.8)'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>GeoWrisX AD | Caregiver Console</title>
    <script>
      // ใส่ธีมก่อนพรีนเทอร์แรกเพื่อไม่ให้หน้าแฟลชขาวในโหมดมืด (ตรรกะเดียวกับ App.jsx)
      // ค่าเริ่มต้น = สว่าง; ถ้าเคยเลือก "มืด" หรือ "อัตโนมัติ" ไว้จะยึดตามที่เก็บไว้
      (function () {
        try {
          var theme = localStorage.getItem('gx-theme') || 'light';
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = theme;
        } catch (e) { /* localStorage ไม่พร้อมใช้ — อยู่โหมดสว่าง */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
