name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Syntax-check Pages Functions
        run: |
          set -euo pipefail
          find functions -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done

      - name: Verify database schema essentials
        run: |
          set -euo pipefail
          grep -q "approve_pillbox_request" db/schema.sql
          grep -q "patient_files" db/schema.sql
          grep -q "owner_id" db/schema.sql
          grep -q "create table if not exists public.caregiver_profiles" db/schema.sql
